spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payments
    username: ${DB_USERNAME:saga}
    password: ${DB_PASSWORD:saga}
  flyway:
    # The outbox and processed-events tables come from saga-common
    locations: classpath:db/saga, classpath:db/payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      # An unreadable event becomes an error for the error handler (and the dead-letter topic) instead of a poison pill
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: com.adrianausin.saga.common.event.SagaEventSerde$EventDeserializer

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
