services:
  # One server, one database per service: no service reads another's tables
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: saga
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
      - saga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga -d saga"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    profiles: ["app"]
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    image: saga/order-service:latest
    profiles: ["app"]
    ports:
      - "${ORDER_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on: &infrastructure
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck: &app-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  payment-service:
    build:
      context: .
      args:
        SERVICE: payment-service
    image: saga/payment-service:latest
    profiles: ["app"]
    ports:
      - "${PAYMENT_PORT:-8081}:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on: *infrastructure
    healthcheck: *app-healthcheck

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: saga/inventory-service:latest
    profiles: ["app"]
    ports:
      - "${INVENTORY_PORT:-8082}:8080"
    environment:
      PORT: 8080
      DB_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on: *infrastructure
    healthcheck: *app-healthcheck

volumes:
  saga-data:
